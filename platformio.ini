[platformio]
src_dir = main
default_envs = d1_mini

[env:d1_mini]
platform = platformio/espressif8266@4.2.1
board = d1_mini
framework = arduino
; the ESP8266 core recommends 160 MHz for TLS, used for the pool API
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.3

; pio run -e d1_mini_ota -t upload: the same firmware over Wi-Fi
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = nerdminer-rig.local
extra_scripts = scripts/ota_auth.py

; pio run -e miner -t flash_miner: NerdMiner on one ESP32 miner connected by USB
[env:miner]
platform = platformio/native@1.2.1
platform_packages = platformio/tool-esptoolpy@1.30000.201119
upload_speed = 460800
extra_scripts = scripts/flash_miner.py

; pio test -e native: pool API parsing on this computer, no board needed
[env:native]
platform = platformio/native@1.2.1
build_src_filter = +<pool.cpp>
test_build_src = yes
build_flags = -D UNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson@7.4.3
